<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAPOR PAK BUK</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e5ddd5;
}

/* LOGIN */
.login, .register {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CARD LOGIN */
.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 320px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  text-align: center;
}

.card h2 {
  margin-bottom: 15px;
}

/* INPUT KHUSUS LOGIN */
.input-login {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  border-radius: 8px;
  background: #25d366;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

/* CHAT */
.container {
  display: none;
  flex-direction: column;
  height: 100dvh;
  }

.header {
  background: #075e54;
  color: white;
  padding: 12px;
  text-align: center;
  font-weight: bold;
  flex-shrink: 0;
}

/* CHAT */
.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

/* BUBBLE */
.bubble {
  background: #dcf8c6;
  padding: 10px;
  border-radius: 10px;
  margin: 5px 0;
  max-width: 75%;
  word-wrap: break-word;
}

/* INPUT AREA FIX */
.input-area {
  display: flex;
  align-items: center;
  padding: 8px;
  background: #f0f0f0;
  gap: 5px;

  position: sticky;
  bottom: 0;
}

/* INPUT CHAT */
.input-chat {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: none;
  outline: none;
}

/* FILE */
.file-input {
  width: 40px;
}

/* BUTTON */
.send-btn {
  background: #25d366;
  border: none;
  padding: 10px;
  border-radius: 50%;
  color: white;
}

img, video {
  max-width: 200px;
  max-height: 200px;
  border-radius: 10px;
  display: block;
}

/* Tombol file */
.file-btn {
  background: #ddd;
  border-radius: 50%;
  padding: 10px;
  font-size: 18px;
  cursor: pointer;
}

.file-btn input {
  display: none;
}

/* Popup */
/* overlay gelap */
#popup {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);

  justify-content: center;
  align-items: center;
}

/* box popup */
.popup-content {
  background: white;
  padding: 15px;
  border-radius: 15px;
  width: 90%;
  max-width: 300px;
  text-align: center;
}

/* preview */
#previewArea img,
#previewArea video {
  max-width: 100%;
  border-radius: 10px;
  margin: 10px 0;
}

/* tombol container */
.popup-buttons {
  display: flex;
  gap: 10px;
}

/* tombol khusus (override global) */
.popup-buttons button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
}

/* warna tombol */
.btn-batal {
  background: #ccc;
}

.btn-kirim {
  background: #25d366;
  color: white;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
  <div class="card">
    <h2>Login</h2>
    <input class="input-login" type="text" id="user" placeholder="User">
    <input class="input-login" type="password" id="pass" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="showRegister()">Buat Akun</button>
  </div>
</div>

<!-- REGISTER -->
<div class="register" id="registerPage" style="display:none;">
  <div class="card">
    <h2>Buat Akun</h2>

    <input class="input-login" type="text" id="nama" placeholder="Nama">

    <select class="input-login" id="kelas">
      <option value="">Pilih Kelas</option>
      <option>XA</option>
      <option>XB</option>
      <option>XIA</option>
      <option>XIB</option>
      <option>XIIA</option>
      <option>XIIB</option>
      <option>GURU</option>
      <option>STAF SEKOLAH</option>
    </select>

    <input class="input-login" type="tel" id="hp" placeholder="Nomor HP" inputmode="numeric">

    <div style="position:relative;">
      <input class="input-login" type="password" id="passwordBaru" placeholder="Buat Password">
      <span onclick="togglePass()" style="
        position:absolute;
        right:10px;
        top:12px;
        cursor:pointer;">👁️</span>
    </div>

    <!-- CAPTCHA -->
    <div id="captchaText" style="margin:10px 0; font-weight:bold;"></div>
    <input class="input-login" type="text" id="captchaInput" placeholder="Masukkan Captcha">

    <button onclick="kirimAkun()">Kirim Akun</button>
  </div>
</div>

<!-- CHAT -->
<div class="container" id="chatPage">
  <div class="header" id="headerTitle">LAPOR PAK BUK</div>

  <div class="chat-box" id="chat"></div>

  <div class="input-area">
    <label class="file-btn">
  📎
  <input type="file" id="file" onchange="previewFile()">
</label>
    <input class="input-chat" type="text" id="text" placeholder="Ketik laporan...">
    <button class="send-btn" onclick="kirim()">➤</button>
  </div>
</div>

<div id="popup">
  <div class="popup-content">
    <p><b>Kirim Foto?</b></p>

    <div id="previewArea"></div>

    <div class="popup-buttons">
      <button class="btn-batal" onclick="batal()">Batal</button>
      <button class="btn-kirim" onclick="kirimFix()">Kirim</button>
    </div>
  </div>
</div>

<script>
// DATA USER (ISI SENDIRI)
const users = [
  {user:"a", pass:""},
  {user:"osis", pass:"osis1"},
  {user:"", pass:""},
];

let currentUser = "";
let selectedFile = null;
let lastSend = 0;

// LOGIN
function login() {
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  let found = users.find(x => x.user === u && x.pass === p);

  if (found) {
    currentUser = u;

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("chatPage").style.display = "flex";

    // tampilkan nama di header
    document.getElementById("headerTitle").innerText = "LAPOR PAK BUK - " + currentUser;

  } else {
    alert("User / Password salah");
  }
}

// REGISTER
function showRegister() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("registerPage").style.display = "flex";
}

async function kirimAkun() {
  let nama = document.getElementById("nama").value;
  let kelas = document.getElementById("kelas").value;
  let hp = document.getElementById("hp").value;
  let password = document.getElementById("passwordBaru").value;
  let captchaInput = document.getElementById("captchaInput").value;

  // ======================
  // VALIDASI KOSONG
  // ======================
  if (!nama || !kelas || !hp || !password || !captchaInput) {
    alert("Semua field wajib diisi!");
    return;
  }

  // ======================
  // VALIDASI NOMOR HP
  // ======================
  if (!/^[0-9]+$/.test(hp)) {
    alert("Nomor HP harus berupa angka!");
    return;
  }

  if (hp.length < 10) {
    alert("Nomor HP minimal 10 digit!");
    return;
  }

  // (opsional Indonesia)
  if (!hp.startsWith("08")) {
    alert("Nomor HP harus diawali 08!");
    return;
  }

  // ======================
  // VALIDASI CAPTCHA
  // ======================
  if (captchaInput !== captcha) {
    alert("Captcha salah!");
    generateCaptcha();
    return;
  }

  // ======================
  // KIRIM KE TELEGRAM
  // ======================
  let pesan = `AKUN BARU BUTUH VERIFIKASI

NAMA : ${nama.toUpperCase()}
KELAS : ${kelas}
NO HP : ${hp}
PASSWORD : ${password}`;

  await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: pesan
    })
  });

  alert("Akun anda akan siap dalam 1x24 jam - Pastikan data sudah benar");
  location.reload();
}

// TELEGRAM
const TOKEN = "8724503773:AAGL9c35ci7KZ4SLUL1p_PMrE9rLkmyppYQ";
const CHAT_ID = "7327517194";

function addBubble(text) {
  let div = document.createElement("div");
  div.className = "bubble";
  div.innerHTML = text;
  document.getElementById("chat").appendChild(div);
}

async function kirim() {
  let text = document.getElementById("text").value;

  // =====================
  // ANTI SPAM
  // =====================
  if (Date.now() - lastSend < 3000) {
    alert("Tunggu sebentar sebelum kirim lagi!");
    return;
  }
  lastSend = Date.now();

  if (!text) return;

  let pesan = text + "\n\n— " + currentUser;

  addBubble(text);

  // kirim text
  await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: pesan
    })
  });

  // =====================
  // KIRIM LOKASI OTOMATIS
  // =====================
  kirimLokasi();

  document.getElementById("text").value = "";
}

function previewFile() {
  const file = document.getElementById("file").files[0];
  if (!file) return;

  selectedFile = file;

  let preview = "";

  if (file.type.startsWith("image/")) {
    preview = `<img src="${URL.createObjectURL(file)}">`;
  } else if (file.type.startsWith("video/")) {
    preview = `<video src="${URL.createObjectURL(file)}" controls></video>`;
  } else {
    preview = `📎 ${file.name}`;
  }

  document.getElementById("previewArea").innerHTML = preview;
  document.getElementById("popup").style.display = "block";
}

function batal() {
  document.getElementById("popup").style.display = "none";
  document.getElementById("file").value = "";
  selectedFile = null;
}

async function kirimFix() {
  document.getElementById("popup").style.display = "none";

  // =====================
  // ANTI SPAM
  // =====================
  if (Date.now() - lastSend < 3000) {
    alert("Tunggu sebentar sebelum kirim lagi!");
    return;
  }
  lastSend = Date.now();

  if (!selectedFile) return;

  // tampilkan di chat
  if (selectedFile.type.startsWith("image/")) {
    addBubble(`<img src="${URL.createObjectURL(selectedFile)}">`);
  } else if (selectedFile.type.startsWith("video/")) {
    addBubble(`<video src="${URL.createObjectURL(selectedFile)}" controls></video>`);
  } else {
    addBubble(`📎 ${selectedFile.name}`);
  }

  // kirim file
  let fd = new FormData();
  fd.append("chat_id", CHAT_ID);
  fd.append("document", selectedFile);
  fd.append("caption", "Dikirim oleh: " + currentUser);

  await fetch(`https://api.telegram.org/bot${TOKEN}/sendDocument`, {
    method: "POST",
    body: fd
  });

  // =====================
  // KIRIM LOKASI OTOMATIS
  // =====================
  kirimLokasi();

  // auto reply web
  setTimeout(() => {
    addBubble(`<i>Laporan berhasil terkirim<br><br>Terimakasih<br>-BOT SMANTI</i>`);
  }, 800);

  document.getElementById("file").value = "";
  selectedFile = null;
}

function kirimLokasi() {
  if (!navigator.geolocation) {
    alert("Browser tidak mendukung lokasi");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async function(pos) {
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;

      console.log("Lokasi:", lat, lon); // debug

      try {
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendLocation`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            chat_id: CHAT_ID,
            latitude: lat,
            longitude: lon
          })
        });

        console.log("Lokasi terkirim");
      } catch (err) {
        alert("Gagal kirim lokasi");
        console.error(err);
      }
    },
    function(error) {
      alert("Izin lokasi ditolak / gagal diambil");
      console.error(error);
    }
  );
}

</script>

</body>
</html>
